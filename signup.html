<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillMint — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #080c14;
      --bg-surface: #0e1420;
      --border: rgba(255, 255, 255, 0.08);
      --gold: #fbbf24;
      --gold-light: #fde68a;
      --rose: #fb7185;
      --text-primary: #f0f4ff;
      --text-secondary: #8b9ab5;
      --radius: 14px;
      --font-display: "Syne", sans-serif;
      --font-body: "DM Sans", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 15% 20%, rgba(251,191,36,0.12), transparent 40%), var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      padding: 20px;
    }

    .signup-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 24px;
      color: var(--gold);
    }

    .title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 22px;
    }

    .form-group { margin-bottom: 14px; }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      background: #080c14;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .form-input:focus {
      border-color: rgba(251,191,36,0.55);
      box-shadow: 0 0 0 3px rgba(251,191,36,0.12);
    }

    .btn {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .message {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    .message.error { color: var(--rose); }
    .message.success { color: var(--gold-light); }

    .auth-link {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .auth-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-link a:hover {
      color: var(--gold-light);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup-card">
    <div class="brand">🪙 SkillMint</div>
    <div class="title">Create account</div>
    <div class="subtitle">Sign up to start exchanging skills</div>

    <form id="signup-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" id="username" type="text" placeholder="rani" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input class="form-input" id="fullName" type="text" placeholder="Rani Jadhav" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" required />
      </div>
      <button class="btn" id="signup-btn" type="submit">Sign Up</button>
      <div id="signup-message" class="message"></div>
      <div class="auth-link">Already have an account? <a href="login.html">Login</a></div>
    </form>
  </div>

  <script>
    const API_BASE = "http://localhost:8080/api";

    async function parseJsonSafe(response) {
      if (response.status === 204) return null;
      const text = await response.text();
      if (!text) return null;
      try {
        return JSON.parse(text);
      } catch (err) {
        return null;
      }
    }

    async function register(payload) {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await parseJsonSafe(res);
      if (!res.ok) throw new Error(data?.message || `Register failed (${res.status})`);
      return data;
    }

    function setMessage(text, type) {
      const el = document.getElementById("signup-message");
      el.className = `message ${type || ""}`;
      el.textContent = text || "";
    }

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        username: document.getElementById("username").value.trim(),
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };
      const btn = document.getElementById("signup-btn");

      if (!payload.username || !payload.fullName || !payload.email || !payload.password) {
        setMessage("Please fill all fields.", "error");
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = "Creating account...";
        setMessage("", "");
        await register(payload);
        setMessage("Signup successful. Redirecting to login...", "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 500);
      } catch (err) {
        setMessage(err.message || "Signup failed. Please try again.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign Up";
      }
    });
  </script>
</body>
</html>
