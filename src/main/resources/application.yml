spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skillmint}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Rani2004}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-that-must-be-at-least-32-chars}
    expiration-ms: 86400000
